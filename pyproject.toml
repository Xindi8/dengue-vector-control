[project]
name = "dengue-vector-control"
version = "1.0.0"
description = "Dengue vector control in San Juan, Puerto Rico: SEIR-SEI model, calibration to the 2010/11 DENV-1 season, and intervention scenarios (MATH 574 term project)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
